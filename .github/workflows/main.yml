name: Build DarsJadvali APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Loyihani olish
        uses: actions/checkout@v4

      - name: Java o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle o'rnatish
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK yaratish
        run: gradle assembleDebug

      - name: APKni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: DarsJadvali-APK
          path: app/build/outputs/apk/debug/app-debug.apk
